<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A question for {{ to_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="card">
    <p class="to">For {{ to_name }}</p>
    <h1>What are you free for?</h1>
    <p class="message">{{ message }}</p>

    <form method="post" action="{{ url_for('choose') }}">
      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <label class="date-field">
        <span>Pick a day</span>
        <input
          type="date"
          name="date"
          min="{{ min_date }}"
          {% if max_date %}max="{{ max_date }}"{% endif %}
          required
        >
      </label>

      <fieldset class="activities">
        <legend>Pick an activity</legend>
        <div class="activity-grid">
          {% for activity in activities %}
          <span class="activity">
            <input
              type="radio"
              name="activity"
              id="{{ activity.id }}"
              value="{{ activity.id }}"
              required
            >
            <label for="{{ activity.id }}">{{ activity.label }}</label>
          </span>
          {% endfor %}
        </div>
      </fieldset>

      <label class="note-field">
        <span>Anything you want to add? (optional)</span>
        <textarea name="note" placeholder="e.g. can we do it a bit earlier?"></textarea>
      </label>

      <button type="submit">I'm in</button>
    </form>

    <p class="from">— {{ from_name }}</p>
  </main>
</body>
</html>
