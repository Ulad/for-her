[project]
name = "for-her"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "flask==3.1.3",
]
[project.optional-dependencies]
dev = [
    "prek==0.5.1",
]

[tool.ruff]
line-length = 120
[tool.ruff.format]
docstring-code-format = true
[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "D101", # Missing docstring in public class
]
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
[tool.ruff.lint.mccabe]
max-complexity = 7  # Flag errors (`C901`) whenever the complexity level exceeds a threshold.
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
    "CPY001", # missing-copyright-notice
    # pydocstyle — docstrings only where they add value; D101/D102 still enforced in src
    "D100",   # missing module docstring
    "D103",   # missing function docstring
    "D104",   # missing package docstring
    "D105",   # missing magic-method docstring
    "D106",   # missing nested-class docstring
    "D107",   # missing __init__ docstring
    "D202",   # no blank line after docstring
    "D203",   # blank line before class docstring (conflicts with D211)
    "D205",   # blank line between summary and body
    "D212",   # summary on first line
    "FIX002", # line contains TODO
    "RUF001", # ambiguous unicode in string
    "RUF002", # ambiguous unicode in docstring
    "RUF003", # ambiguous unicode in comment
    "TD",     # missing issue link on TODO
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"

[tool.mypy]
explicit_package_bases = true
disallow_any_generics = false
strict = true
no_implicit_reexport = true
show_error_codes = true

[tool.pyrefly]
preset = "strict"
